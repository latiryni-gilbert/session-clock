name: Deploy push worker

on:
  push:
    branches: [main]
    paths:
      - 'push-worker/**'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a second one waits for the first to finish.
concurrency:
  group: deploy-push-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    # The manual "Run workflow" button lets you pick any branch; only main may be deployed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: push-worker

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: push-worker/package-lock.json

      - name: Install push worker dependencies
        run: npm ci

      - name: Type check push worker
        run: npm run typecheck

      - name: Test push worker
        run: npm test

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: push-worker
          # Injects the commit being deployed as GIT_COMMIT_SHA, which /health reports as "version".
          command: deploy --var GIT_COMMIT_SHA:${{ github.sha }}

      # A new deploy can take a moment to go live everywhere, so retry for about 30 seconds.
      - name: Smoke test the deployed Worker
        env:
          # Repository variable (not a secret): the Worker's base URL, e.g. https://session-clock-push.<subdomain>.workers.dev
          PUSH_WORKER_URL: ${{ vars.PUSH_WORKER_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -z "$PUSH_WORKER_URL" ]; then
            echo "::error title=PUSH_WORKER_URL is not set::The Worker was deployed but not smoke tested. Set the repository variable PUSH_WORKER_URL (Settings > Secrets and variables > Actions > Variables > New repository variable) to the Worker's base URL, for example https://session-clock-push.<your-subdomain>.workers.dev, then re-run this workflow."
            exit 1
          fi
          case "$PUSH_WORKER_URL" in
            http://*|https://*) ;;
            *)
              echo "::error title=PUSH_WORKER_URL is invalid::It must start with https:// (got: $PUSH_WORKER_URL)."
              exit 1
              ;;
          esac
          url="${PUSH_WORKER_URL%/}/health"
          attempts=7
          delay=5
          for attempt in $(seq 1 "$attempts"); do
            echo "Attempt $attempt/$attempts: GET $url (expecting version $EXPECTED_SHA)"
            rm -f response.json
            status=$(curl --silent --show-error --max-time 10 --output response.json --write-out '%{http_code}' "$url") || status="000"
            echo "HTTP status: $status"
            echo "Response body:"
            cat response.json 2>/dev/null || true
            echo
            if [ "$status" = "200" ] && jq -e --arg sha "$EXPECTED_SHA" '.ok == true and .version == $sha' response.json >/dev/null 2>&1; then
              echo "Smoke test passed: $url is healthy and running $EXPECTED_SHA."
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "Not healthy yet; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "::error title=Smoke test failed::$url did not return 200 with ok=true and version=$EXPECTED_SHA after $attempts attempts. See the last response above."
          exit 1
